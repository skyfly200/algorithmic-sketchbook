# Optional Netlify hosting (alongside the GitHub Pages workflow). Connect this
# repo in Netlify and it builds on every push to main. The Vite base is './'
# (relative), so the site works from any host or subpath.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback + asset guard live in public/_redirects (copied to the publish
# root), where the ordered rules are evaluated top-down. We keep them there
# rather than here so the asset-guard rule reliably precedes the catch-all —
# netlify.toml redirects are processed before _redirects, so splitting them
# across both files would let the catch-all shadow the guard.
